[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eta-route-optimization"
version = "0.2.0"
description = "Leakage-aware ETA prediction and last-mile route optimization research pipeline."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "lightgbm>=4.0",
  "ortools>=9.8",
  "ijson>=3.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "python-docx>=1.2"]
gnn = ["torch>=2.2"]

[project.scripts]
eta-route-audit = "eta_route_optimization.audit:main"
eta-route-build-dataset = "eta_route_optimization.eta_dataset:main"
eta-route-validate = "eta_route_optimization.validate_protocol:main"
eta-route-eta-experiment = "eta_route_optimization.eta_experiment:main"
eta-route-amazon-experiment = "eta_route_optimization.amazon_experiment:main"
eta-route-robustness = "eta_route_optimization.robustness_diagnostic:main"
eta-route-balanced = "eta_route_optimization.balanced_experiment:main"
eta-route-rolling-origin = "eta_route_optimization.rolling_origin:main"
eta-route-soft-windows = "eta_route_optimization.soft_window_experiment:main"
eta-route-routing-stability = "eta_route_optimization.routing_stability:main"
eta-route-deployment-benchmark = "eta_route_optimization.deployment_benchmark:main"
eta-route-provenance = "eta_route_optimization.provenance:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
